<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        header {
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: aqua;
            padding: 0 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo229 {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(138, 130, 254);
        }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .center-image {
            width: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .center-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>LOGO</h1>
            <div class="logo229"></div>
        </div>
        <button>Войти</button>
    </header>
    <main>
        <img src="eye.jpg" class="center-image">
        <p class="center-text">сарсинов кривцов</p>
    </main>
</body>
</html>
